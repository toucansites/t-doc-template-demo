        <path d="m4.66699 12.4998h-.83333c-.44203 0-.86595-.1756-1.17851-.4881-.31256-.3126-.48816-.7365-.48816-1.1785v-7.50003c0-.44203.1756-.86595.48816-1.17851s.73648-.48816 1.17851-.48816h7.50004c.442 0 .8659.1756 1.1785.48816.3125.31256.4881.73648.4881 1.17851v.83333m-3.33331 3.33334h7.50001c.9205 0 1.6667.74619 1.6667 1.66666v7.5c0 .9205-.7462 1.6667-1.6667 1.6667h-7.50001c-.92047 0-1.66666-.7462-1.66666-1.6667v-7.5c0-.92047.74619-1.66666 1.66666-1.66666z" stroke="#e3e3e3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
      </svg>
      <svg
